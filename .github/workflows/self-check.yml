# Checks this repo: actionlint on every workflow here, the script tests, and the shared baseline run
# against this repo.
name: Self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # To upgrade: pick a release at least two weeks old and copy the linux_amd64 SHA-256 from that
  # release's actionlint_<version>_checksums.txt.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint workflows and templates
        run: actionlint -color .github/workflows/*.yml templates/*-ci.yml

  scripts:
    name: Script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Unit tests
        run: node --test "tests/*.test.mjs"

      # The same steps the shared workflows use to fetch their scripts, so a context that stops
      # resolving fails here first.
      - name: Check out the shared scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-ci
          sparse-checkout: scripts
          persist-credentials: false

      - name: Move the shared scripts out of the workspace
        env:
          SHARED_REPO: ${{ job.workflow_repository }}
          SHARED_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$SHARED_REPO" ] || [ -z "$SHARED_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty."
            exit 1
          fi
          echo "Shared scripts from $SHARED_REPO@$SHARED_SHA"
          mv .shared-ci/scripts "$RUNNER_TEMP/shared-ci"
          rm -rf .shared-ci

      - name: Run both checks on the sample project
        run: |
          node "$RUNNER_TEMP/shared-ci/check-npm-version.mjs" tests/fixtures/sample-project
          node "$RUNNER_TEMP/shared-ci/check-lockfile.mjs" tests/fixtures/sample-project

  baseline:
    uses: ./.github/workflows/baseline.yml
